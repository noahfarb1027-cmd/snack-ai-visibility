name: Weekly AI visibility run

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC (6am Eastern in winter, 7am in summer)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # so the job can commit results back to the repo
  pages: write              # so it can publish the dashboard
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Ask the engines and score
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python tracker.py --runs 3

      - name: Rebuild dashboard data
        run: python build_dashboard.py

      - name: Commit results
        run: |
          git config user.name "aeo-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/data.json
          git diff --cached --quiet || git commit -m "Weekly AI visibility run $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
